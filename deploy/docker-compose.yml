services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dbtest
    volumes:
      - ./pg/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Веб-сервер Nginx
  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
     - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - db

  # Админка для БД
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.org
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
    depends_on:
    - db


  prometheus:
    image: prom/prometheus:latest
    user: root
    container_name: lprometheus
    volumes:
      - ./prometheus/cfg:/etc/prometheus
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "19090:9090"

  nodeexporter:
    image: prom/node-exporter:latest
    container_name: lnodeexporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "19100:9100"

  grafana:
    image: grafana/grafana-oss
    user: root
    container_name: lgrafana
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=spectraphilic-windrose-panel,operato-windrose-panel
    ports:
      - "13000:3000"
    depends_on:
      - prometheus

