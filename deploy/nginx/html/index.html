<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Пример</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
  </head>
<body>
  <h1>Привет</h1>
  <p id="timestamp"></p>

  <script>
    const p = document.getElementById("timestamp")
    setInterval(function () {
      p.innerHTML = ""+Date.now();
    }, 2000)
  </script>

</body>
</html>
